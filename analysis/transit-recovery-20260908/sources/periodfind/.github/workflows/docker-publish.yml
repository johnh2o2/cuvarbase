name: Build and push periodfind image

# Builds the CPU and GPU runtime images and pushes them to Docker Hub, from
# which the CVMFS unpacked sync (opened by a separate PR) mirrors them to
# /cvmfs/singularity.opensciencegrid.org/<user>/periodfind:<tag>. PRs build both
# variants without pushing, so a broken image fails the check.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.gpu
      - rust/**
      - periodfind/**
      - pyproject.toml
      - setup.py
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Separate repos per variant (matching fiesta / fiesta-gpu), not tags.
          - variant: cpu
            dockerfile: Dockerfile
            repo_suffix: ""
          - variant: gpu
            dockerfile: Dockerfile.gpu
            repo_suffix: "-gpu"
    steps:
      - uses: actions/checkout@v4

      # The CUDA devel base + build layers fill the runner otherwise.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          repo="${{ secrets.DOCKERHUB_USERNAME }}/periodfind${{ matrix.repo_suffix }}"
          sha="${GITHUB_SHA::12}"
          echo "tags=${repo}:latest,${repo}:${sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.variant }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
