[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cuvarbase"
dynamic = ["version"]
description = "Period-finding and variability on the GPU"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
authors = [
    {name = "John Hoffman", email = "johnh2o2@gmail.com"}
]
keywords = ["astronomy", "GPU", "CUDA", "period-finding", "time-series"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Programming Language :: C++",
]
# numpy/scipy floors: the oldest releases that install on every supported
# interpreter (1.17/1.3 have no Python 3.9 wheels and were tested nowhere);
# 1.22/1.8 pass the CPU suite on 3.9.
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pycuda>=2017.1.1,!=2024.1.2",
]

[project.optional-dependencies]
# Test extra: what `pytest --pyargs cuvarbase` needs beyond the runtime
# deps. matplotlib is not needed (every plotting import sits behind
# plot=False); batman-package and transitleastsquares exercise the
# limb-darkened TLS templates and the TLS reference comparisons.
test = [
    "pytest",
    "nfft",
    "astropy",
    "batman-package",
    "transitleastsquares",
]
cufinufft = [
    "cufinufft>=2.2",
]
# Mirrors docs/requirements.txt (the numpy/scipy floors come from the
# runtime dependencies above).
docs = [
    "sphinx>=7,<9",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/johnh2o2/cuvarbase"
Documentation = "https://johnh2o2.github.io/cuvarbase/"
Repository = "https://github.com/johnh2o2/cuvarbase"
"Bug Tracker" = "https://github.com/johnh2o2/cuvarbase/issues"

[tool.setuptools.packages.find]
include = ["cuvarbase*"]

[tool.setuptools.package-data]
cuvarbase = ["kernels/*.cu", "kernels/*.cuh"]

[tool.setuptools.dynamic]
version = {attr = "cuvarbase.__version__"}

[tool.pytest.ini_options]
testpaths = ["cuvarbase/tests"]
addopts = "-rs --strict-markers"
markers = [
    "gpu: needs a CUDA device",
]
# Only warnings the library emits on purpose are silenced here; everything
# else (DeprecationWarning, RuntimeWarning, ...) stays visible in the
# summary so a new one is noticed.
filterwarnings = [
    # tls_models: informational, fires once at import when the optional
    # batman-package is absent (the analytic template is used instead)
    "ignore:batman package not available:UserWarning",
    # nufft_lrt: the deliberate EXPERIMENTAL notice (re-validation pending)
    "ignore:.*nufft.?lrt.*EXPERIMENTAL:UserWarning",
]
