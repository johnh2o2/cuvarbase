name: Tests

on:
  push:
  pull_request:

jobs:
  # CPU test suite: the root conftest stubs pycuda/skcuda, so the pure-CPU
  # tests (sparse BLS ground truth, TLS grids/models/stats, NUFFT-LRT
  # algorithm, frequency grids, lazy-import contract) run and GPU tests
  # skip. GPU kernels are validated manually before releases (see
  # scripts/gpu-test.sh and docs/RUNPOD_DEVELOPMENT.md).
  test-cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "numpy>=1.17" "scipy>=1.3" astropy pytest nfft

    - name: Run CPU test suite (GPU tests skip via stubbed pycuda)
      run: |
        python -m pytest cuvarbase/tests -v --tb=short

  # Packaging smoke test: build the wheel, install it into a clean
  # environment, and import it (with pycuda stubbed). This catches
  # missing-subpackage and metadata bugs that source-tree testing hides.
  package-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Install wheel (no deps) and import
      run: |
        python -m venv /tmp/smoke
        /tmp/smoke/bin/pip install --upgrade pip
        /tmp/smoke/bin/pip install "numpy>=1.17" "scipy>=1.3"
        /tmp/smoke/bin/pip install --no-deps dist/*.whl
        /tmp/smoke/bin/python scripts/ci_wheel_smoke.py

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint with flake8 (errors only)
      run: |
        # Syntax errors and undefined names are real failures
        flake8 cuvarbase --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Lint with flake8 (style, advisory)
      run: |
        flake8 cuvarbase --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
